services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ai_investment_lab
      POSTGRES_USER: ai_lab
      POSTGRES_PASSWORD: ai_lab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_lab -d ai_investment_lab"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      AIL_DATABASE_URL: postgresql+psycopg://ai_lab:ai_lab@postgres:5432/ai_investment_lab
      AIL_EODHD_API_TOKEN: ${AIL_EODHD_API_TOKEN:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
