[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-investment-lab-worker"
version = "0.1.0"
description = "Idempotent market-data and valuation jobs for AI Investment Lab"
requires-python = ">=3.13"
dependencies = [
  "ai-investment-lab-data-providers==0.1.0",
  "ai-investment-lab-db==0.1.0",
  "ai-investment-lab-domain==0.1.0",
  "SQLAlchemy==2.0.52"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai_investment_lab.worker*"]
namespaces = true
