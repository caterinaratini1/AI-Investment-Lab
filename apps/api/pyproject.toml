[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-investment-lab-api"
version = "0.1.0"
description = "FastAPI service for AI Investment Lab"
requires-python = ">=3.13"
dependencies = [
  "ai-investment-lab-db==0.1.0",
  "ai-investment-lab-domain==0.1.0",
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "uvicorn[standard]==0.52.4"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai_investment_lab.api*"]
namespaces = true
