name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python and PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: ai_investment_lab
          POSTGRES_USER: ai_lab
          POSTGRES_PASSWORD: ai_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_lab -d ai_investment_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIL_DATABASE_URL: postgresql+psycopg://ai_lab:ai_lab@localhost:5432/ai_investment_lab
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-lock.txt
            requirements-runtime-lock.txt
            apps/api/pyproject.toml
            apps/worker/pyproject.toml
            packages/data_providers/pyproject.toml
            packages/db/pyproject.toml
            packages/domain/pyproject.toml
      - name: Install Python environment
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Lint and format check
        run: ruff check . && ruff format --check .
      - name: Static type check
        run: mypy apps/api/src apps/worker/src packages/data_providers/src packages/db/src packages/domain/src
      - name: Test accounting, market data, persistence, worker, and API
        run: pytest
      - name: Verify committed OpenAPI contract is current
        run: python scripts/export_openapi.py && git diff --exit-code -- schemas/openapi.json
      - name: Verify PostgreSQL migration lifecycle and schema parity
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

  web:
    name: Next.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install locked web dependencies
        run: npm ci
      - name: Verify generated TypeScript API contract is current
        run: npm run generate:api-client && git diff --exit-code -- packages/api_client/src/schema.d.ts
      - name: Lint, type-check, test, and build
        run: npm run lint:web && npm run typecheck:web && npm run test:web && npm run build:web
