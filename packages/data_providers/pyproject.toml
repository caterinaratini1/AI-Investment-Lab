[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-investment-lab-data-providers"
version = "0.1.0"
description = "Point-in-time market-data adapters for AI Investment Lab"
requires-python = ">=3.13"
dependencies = [
  "httpx==0.28.1"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai_investment_lab.data_providers*"]
namespaces = true
