[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-investment-lab-db"
version = "0.1.0"
description = "PostgreSQL persistence for AI Investment Lab"
requires-python = ">=3.13"
dependencies = [
  "alembic==1.19.2",
  "ai-investment-lab-domain==0.1.0",
  "psycopg[binary]==3.3.5",
  "SQLAlchemy==2.0.52"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai_investment_lab.db*"]
namespaces = true
